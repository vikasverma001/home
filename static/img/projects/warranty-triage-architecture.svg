<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Solution architecture for smart warranty triage on Service Cloud">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5E7045" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8B6F"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5764E"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A6AE92"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="948" height="808" rx="16" fill="#FCFAF4" stroke="#E4DECF" stroke-width="1.5"/>

  <!-- caption -->
  <text x="36" y="44" font-size="12" font-weight="700" letter-spacing="1.5" fill="#97A083">SOLUTION ARCHITECTURE</text>
  <text x="36" y="70" font-size="20" font-weight="700" fill="#2E332A">Smart warranty triage on Service Cloud</text>

  <!-- ===================== CHANNELS ===================== -->
  <text x="36" y="112" font-size="11" font-weight="700" letter-spacing="1" fill="#97A083">CUSTOMER CHANNELS</text>

  <!-- channel chips -->
  <g filter="url(#soft)">
    <rect x="36"  y="124" width="148" height="52" rx="10" fill="#FFFFFF" stroke="#C3CEB2"/>
    <rect x="196" y="124" width="148" height="52" rx="10" fill="#FFFFFF" stroke="#C3CEB2"/>
    <rect x="356" y="124" width="148" height="52" rx="10" fill="#FFFFFF" stroke="#C3CEB2"/>
    <rect x="516" y="124" width="148" height="52" rx="10" fill="#FFFFFF" stroke="#C3CEB2"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#2E332A" text-anchor="middle">
    <text x="110" y="155">Email-to-Case</text>
    <text x="270" y="155">Web-to-Case</text>
    <text x="430" y="155">Experience Portal</text>
    <text x="590" y="155">Einstein Bot</text>
  </g>

  <!-- knowledge base (right rail) -->
  <rect x="690" y="124" width="234" height="52" rx="10" fill="#FCFAF4" stroke="#B9C6A6" stroke-dasharray="5 4"/>
  <text x="807" y="146" font-size="13" font-weight="700" fill="#5E7045" text-anchor="middle">Knowledge Base</text>
  <text x="807" y="164" font-size="11" fill="#6B7361" text-anchor="middle">self-service articles &amp; bot answers</text>
  <!-- deflection arrow knowledge -> bot -->
  <line x1="688" y1="150" x2="666" y2="150" stroke="#A6AE92" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <text x="678" y="120" font-size="10.5" fill="#A6AE92" text-anchor="middle" font-style="italic">deflection</text>

  <!-- channels feed rail -->
  <line x1="60" y1="188" x2="640" y2="188" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="350" y1="188" x2="350" y2="206" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== PLATFORM ===================== -->
  <rect x="36" y="208" width="628" height="348" rx="12" fill="#EDF1E6" stroke="#B9C6A6" stroke-width="1.5"/>
  <text x="52" y="232" font-size="12" font-weight="700" letter-spacing="1" fill="#5E7045">SALESFORCE SERVICE CLOUD</text>

  <!-- system of record -->
  <rect x="52" y="246" width="210" height="292" rx="10" fill="#FCFAF4" stroke="#C9D1BC"/>
  <text x="66" y="270" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#97A083">SYSTEM OF RECORD</text>
  <g font-size="12.5" fill="#2E332A">
    <rect x="66" y="282" width="182" height="38" rx="8" fill="#FFFFFF" stroke="#C3CEB2"/><text x="80" y="306">Account</text>
    <rect x="66" y="330" width="182" height="38" rx="8" fill="#FFFFFF" stroke="#C3CEB2"/><text x="80" y="354">Contact</text>
    <rect x="66" y="378" width="182" height="38" rx="8" fill="#FFFFFF" stroke="#C3CEB2"/><text x="80" y="402">Asset · purchase date</text>
    <rect x="66" y="426" width="182" height="38" rx="8" fill="#FFFFFF" stroke="#C3CEB2"/><text x="80" y="450">Case · issue type</text>
    <rect x="66" y="474" width="182" height="38" rx="8" fill="#FFFFFF" stroke="#C3CEB2"/><text x="80" y="498">Warranty Claim · SLA</text>
  </g>

  <!-- automation -->
  <rect x="288" y="246" width="360" height="292" rx="10" fill="#FCFAF4" stroke="#C9D1BC"/>
  <text x="304" y="270" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#97A083">AUTOMATION · RECORD-TRIGGERED FLOW</text>
  <text x="304" y="290" font-size="13.5" font-weight="700" fill="#2E332A">Warranty Triage</text>

  <!-- get asset node -->
  <rect x="304" y="300" width="328" height="40" rx="8" fill="#E3EAD7" stroke="#8FA07C"/>
  <text x="468" y="325" font-size="12.5" fill="#2E332A" text-anchor="middle">Get Asset record · calculate remaining coverage</text>
  <line x1="468" y1="340" x2="468" y2="356" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="468,358 540,396 468,434 396,396" fill="#DCE7CD" stroke="#7C8B6F" stroke-width="1.5"/>
  <text x="468" y="392" font-size="12" font-weight="600" fill="#2E332A" text-anchor="middle">Warranty in</text>
  <text x="468" y="408" font-size="12" font-weight="600" fill="#2E332A" text-anchor="middle">coverage?</text>

  <!-- expired branch -->
  <line x1="396" y1="396" x2="378" y2="396" stroke="#B5764E" stroke-width="2"/>
  <line x1="378" y1="396" x2="378" y2="452" stroke="#B5764E" stroke-width="2" marker-end="url(#arrowT)"/>
  <text x="372" y="388" font-size="11" font-weight="700" fill="#B5764E" text-anchor="end">No</text>
  <rect x="304" y="452" width="150" height="62" rx="9" fill="#F0DECF" stroke="#B5764E"/>
  <text x="379" y="478" font-size="11.5" font-weight="600" fill="#7A4A28" text-anchor="middle">Expired path</text>
  <text x="379" y="495" font-size="10.5" fill="#7A4A28" text-anchor="middle">auto-close +</text>
  <text x="379" y="508" font-size="10.5" fill="#7A4A28" text-anchor="middle">expiry email</text>

  <!-- valid branch -->
  <line x1="540" y1="396" x2="558" y2="396" stroke="#5E7045" stroke-width="2"/>
  <line x1="558" y1="396" x2="558" y2="452" stroke="#5E7045" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="388" font-size="11" font-weight="700" fill="#5E7045" text-anchor="start">Yes</text>
  <rect x="474" y="452" width="158" height="62" rx="9" fill="#DDE8CC" stroke="#5E7045"/>
  <text x="553" y="475" font-size="11.5" font-weight="600" fill="#3F4B30" text-anchor="middle">In-coverage path</text>
  <text x="553" y="492" font-size="10.5" fill="#3F4B30" text-anchor="middle">set priority &amp; SLA,</text>
  <text x="553" y="505" font-size="10.5" fill="#3F4B30" text-anchor="middle">route by issue type</text>

  <!-- platform -> routing -->
  <line x1="553" y1="514" x2="553" y2="560" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="553" y1="560" x2="480" y2="560" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="480" y1="560" x2="480" y2="586" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== ROUTING ===================== -->
  <text x="36" y="580" font-size="11" font-weight="700" letter-spacing="1" fill="#97A083">ROUTING</text>
  <rect x="300" y="588" width="360" height="46" rx="10" fill="#E8EDDF" stroke="#8FA07C" filter="url(#soft)"/>
  <text x="480" y="616" font-size="13" font-weight="600" fill="#2E332A" text-anchor="middle">Omni-Channel routing · skills-based</text>

  <!-- router -> queues -->
  <line x1="480" y1="634" x2="480" y2="644" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="387" y1="644" x2="573" y2="644" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="387" y1="644" x2="387" y2="660" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="573" y1="644" x2="573" y2="660" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="662" width="174" height="58" rx="10" fill="#FCFAF4" stroke="#8FA07C" filter="url(#soft)"/>
  <text x="387" y="687" font-size="12.5" font-weight="700" fill="#2E332A" text-anchor="middle">Hardware Specialists</text>
  <text x="387" y="704" font-size="11" fill="#6B7361" text-anchor="middle">High priority · 2h SLA</text>

  <rect x="486" y="662" width="174" height="58" rx="10" fill="#FCFAF4" stroke="#8FA07C" filter="url(#soft)"/>
  <text x="573" y="687" font-size="12.5" font-weight="700" fill="#2E332A" text-anchor="middle">IT Support</text>
  <text x="573" y="704" font-size="11" fill="#6B7361" text-anchor="middle">Medium · 4h SLA</text>

  <!-- queues -> console -->
  <line x1="387" y1="720" x2="387" y2="730" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="573" y1="720" x2="573" y2="730" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="387" y1="730" x2="573" y2="730" stroke="#7C8B6F" stroke-width="2"/>
  <line x1="480" y1="730" x2="480" y2="742" stroke="#7C8B6F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== AGENTS ===================== -->
  <rect x="300" y="744" width="360" height="50" rx="10" fill="#8FA07C" stroke="#5E7045" filter="url(#soft)"/>
  <text x="480" y="774" font-size="13.5" font-weight="700" fill="#FCFAF4" text-anchor="middle">Service Console — unified agent workspace</text>

  <!-- ===================== ANALYTICS (right rail) ===================== -->
  <rect x="690" y="588" width="234" height="132" rx="10" fill="#FCFAF4" stroke="#B9C6A6" stroke-dasharray="5 4"/>
  <text x="706" y="612" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#97A083">ANALYTICS &amp; DASHBOARDS</text>
  <text x="706" y="638" font-size="12.5" fill="#2E332A">• Agent performance — AHT, FCR</text>
  <text x="706" y="662" font-size="12.5" fill="#2E332A">• Trend analysis — cases by</text>
  <text x="718" y="678" font-size="12.5" fill="#2E332A">product line, top claim reasons</text>
  <text x="706" y="702" font-size="12.5" fill="#2E332A">• SLA &amp; first-response tracking</text>
  <!-- platform -> analytics dashed -->
  <line x1="664" y1="430" x2="688" y2="600" stroke="#A6AE92" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <text x="690" y="520" font-size="10.5" fill="#A6AE92" text-anchor="middle" font-style="italic" transform="rotate(82 690 520)">reporting</text>

  <!-- legend (bottom-left) -->
  <rect x="40" y="744" width="14" height="14" rx="3" fill="#DDE8CC" stroke="#5E7045"/>
  <text x="62" y="755" font-size="11.5" fill="#5A6150">In-coverage path</text>
  <rect x="40" y="770" width="14" height="14" rx="3" fill="#F0DECF" stroke="#B5764E"/>
  <text x="62" y="781" font-size="11.5" fill="#5A6150">Expired path</text>
</svg>
