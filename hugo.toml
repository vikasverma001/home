baseURL = "https://vikasverma.ca/"
languageCode = "en-us"
title = "Vikas Verma — Product Leader & Consultant"
enableEmoji = true
disableKinds = ["taxonomy", "term"]

# Pretty-print blog reading times etc.
[params]
  author = "Vikas Verma"
  description = "Product Manager & Solutions Architect — 20+ years across Retail, Health, Banking, Government & Hospitality. Founder of Vikas Verma Consulting Inc."

# Raw HTML in content files (the designed pages use bespoke markup)
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

